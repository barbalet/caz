name: Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build Caz release packages
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sync CazEnv version from Caz Core
        run: |
          VERSION="$(scripts/caz_version_config.sh)"
          git diff --exit-code cazenv/Config/CazVersion.xcconfig
          echo "CAZ_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build Caz Core
        run: make

      - name: Run CazEnv regression gate
        run: make cazenv-regression

      - name: Package release artifacts
        run: make release-packages

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caz-${{ env.CAZ_VERSION }}-release-packages
          path: dist/*.zip

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Caz ${CAZ_VERSION}" \
              --notes "Caz Core ${CAZ_VERSION} source and CazEnv Catalyst/iOS packages built from the tagged committed source."
          fi
          gh release upload "$TAG" dist/*.zip --clobber
